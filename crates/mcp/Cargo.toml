[package]
name = "cadcraft-mcp"
description = "CADCraft MCP server: JSON-RPC 2.0 over stdio, driving a running app or a headless session"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-render = { workspace = true }
cadcraft-io = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Secure randomness for the per-session control token (MIT OR Apache-2.0).
getrandom = "0.4"
# WHIQ: recovered-file stamps (chrono is the workspace's one time library).
chrono = { workspace = true }
# WHIQ: auto-save on SIGTERM / SIGINT / SIGHUP (Ctrl-C, Ctrl-Break, console close on Windows).
ctrlc = { version = "3.4", features = ["termination"] }
# WHIQ: the process's resident memory on Linux, Windows and macOS (server_status, --max-memory-mb).
memory-stats = "1.2"
